<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sekme Yöneticisi</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="components.css"><link rel="stylesheet" href="tabs.css"></head><body><main><header><h1>Sekme Yöneticisi</h1><input id="search" type="search" placeholder="Başlık veya adres ara…" aria-label="Sekmelerde ve kayıtlı gruplarda ara"><span id="counts" class="muted"></span><button id="site" title="Tüm pencerelerdeki grupsuz sekmeleri siteye göre gruplar">Siteye göre grupla</button><label><input id="pin-manager" type="checkbox"> Her pencerenin başında sabit Sekme Yöneticisi sekmesi</label></header><div id="selection" class="card"><strong id="selected-count"></strong><button id="save-close">Kaydet ve kapat</button><button id="new-group">Yeni gruba al</button><details id="group-select"><summary>Gruba ekle ▾</summary><div id="groups" class="popover card"></div></details><button id="ungroup">Gruptan çıkar</button><button id="close" class="danger">Kapat</button><button id="clear">Seçimi temizle</button><form id="new-form" hidden><input id="group-name" placeholder="Grup adı (boş bırakılırsa Yeni grup)" aria-label="Grup adı"><div id="swatches"></div><button class="primary">Oluştur</button></form></div><p id="message" role="status"></p><section id="saved-section"><div class="saved-heading"><h2>Kayıtlı gruplar</h2><label>Kısayol grubu: <select id="shortcut-target"></select></label><a id="shortcut-settings" href="#">Kısayolu ayarla</a><div id="saved-sort" role="group" aria-label="Sırala"><span class="muted">Sırala:</span> <button type="button" data-sort="date">Eklenme tarihi</button><button type="button" data-sort="manual">Elle</button><button type="button" data-sort="site">Siteye göre</button></div></div><div id="saved"></div></section><div id="windows"></div></main><script type="module" src="tabs.js"></script></body></html>
