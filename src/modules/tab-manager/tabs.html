<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sekme Yöneticisi</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="components.css"><link rel="stylesheet" href="tabs.css"></head><body><main><div id="workspace-bar"></div><header><h1>Sekme Yöneticisi</h1><input id="search" type="search" placeholder="Başlık veya adres ara…" aria-label="Sekmelerde ara"><span id="counts" class="muted"></span><button id="site">Siteye göre grupla</button><label><input id="pin-manager" type="checkbox"> Her pencerenin başında sabit Sekme Yöneticisi sekmesi</label><div id="mode">Gruplama: <button data-mode="workspaces">Çalışma alanları</button><button data-mode="groups">Chrome grupları</button></div></header><div id="convert" hidden>Bu penceredeki Chrome gruplarını çalışma alanına dönüştür <button>Dönüştür</button></div><div id="selection" class="card" hidden><strong id="selected-count"></strong><button id="save-close">Kaydet ve kapat</button><button id="new-group">Yeni gruba al</button><details id="group-select"><summary>Gruba ekle ▾</summary><div id="groups" class="popover card"></div></details><details id="workspace-select" hidden><summary>Alana taşı ▾</summary><div id="workspace-targets" class="popover card"></div></details><button id="ungroup">Gruptan çıkar</button><button id="close" class="danger">Kapat</button><button id="clear">Seçimi temizle</button><form id="new-form" hidden><input id="group-name" placeholder="Grup adı" aria-label="Grup adı"><div id="swatches"></div><button class="primary">Oluştur</button></form></div><p id="message" role="status"></p><div id="windows"></div><div id="workspace-saved"></div><section id="saved-section"><h2>Kaydedilenler</h2><div id="saved"></div></section></main><script type="module" src="tabs.js"></script></body></html>
