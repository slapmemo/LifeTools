<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LifeTools</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="components.css"><link rel="stylesheet" href="popup.css"></head><body><main><header><h1>LifeTools</h1><button id="settings" class="icon-button" title="Ayarlar" aria-label="Ayarlar">&#9881;</button><button id="panel" class="icon-button" title="Paneli aç" aria-label="Paneli aç">&#8599;</button></header><section id="volume-booster"><label for="volume-slider">Ses <output id="volume-value">100%</output></label><input id="volume-slider" type="range" min="0" max="600" step="10" value="100"><div><button data-volume="100">100%</button> <button data-volume="200">200%</button> <button data-volume="400">400%</button> <button id="volume-reset">S?f?rla</button></div><p id="volume-error" role="status"></p></section><button id="tab-manager">Sekme yöneticisi</button><button id="today-sites" class="summary" hidden></button><div id="search-area"><input id="search" type="search" placeholder="Ara veya komut yaz…" aria-label="Ara veya komut yaz"><div id="results"></div></div><textarea id="text" rows="3" maxlength="5000" placeholder="Aklındakini yaz…"></textarea><div class="actions"><button id="note" class="primary">+ Not</button><select id="category" aria-label="Not kategorisi"><option value="note">Notlar</option><option value="read">Okunacaklar</option><option value="watch">İzlenecekler</option><option value="idea">Fikirler</option></select><button id="task">+ Görev</button><label><input id="attach" type="checkbox"> bu sayfa</label></div><p id="feedback" role="status"></p><section><h2>Bugün</h2><button id="today-tasks" class="summary"></button></section><div id="desktop-banner" class="banner" hidden>Masaüstü uygulamasına ulaşılamıyor. <button id="desktop-banner-switch">Depolama ayarları</button></div></main><script src="popup.js" type="module"></script></body></html>
