<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeTools</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
  <header>
    <span class="brand-mark" aria-hidden="true"><svg class="lt-logo" viewBox="0 0 128 128" aria-hidden="true" focusable="false"><rect x="3" y="3" width="122" height="122" rx="29" fill="var(--accent)"/><g fill="var(--on-accent)"><path d="M 28 27 L 44 27 L 35 79 L 62 79 L 59.4 94 L 17 94 Z"/><path d="M 56 27 L 109 27 L 106 42 L 87.4 42 L 79.2 83 L 62.9 83 L 71.3 42 L 53.3 42 Z"/><path d="M 73 110 C 72 96 79 83 93 77 C 99 74 107 72 113 70 C 113 90 102 105 88 109 C 82 111 77 111 73 110 Z"/></g><path d="M 75 109 C 81 96 93 86 105 81" fill="none" stroke="var(--accent)" stroke-width="4.4" stroke-linecap="round"/></svg></span>
    <h1>LifeTools</h1>
    <button id="settings" class="icon-button" title="Ayarlar" aria-label="Ayarlar"><span data-icon="settings"></span></button>
    <button id="panel" class="icon-button" title="Paneli aç" aria-label="Paneli aç"><span data-icon="external-link"></span></button>
  </header>
  <section id="volume-booster" class="card">
    <div class="card-head">
      <span class="card-icon" data-icon="audio-lines"></span>
      <label for="volume-slider" class="card-title">Bu sekmenin sesi</label>
      <output id="volume-value" class="card-value">100%</output>
    </div>
    <input id="volume-slider" type="range" min="0" max="600" step="10" value="100">
    <div class="volume-presets"><button data-volume="100">100%</button><button data-volume="200">200%</button><button data-volume="400">400%</button><button id="volume-reset">Sıfırla</button></div>
    <p id="volume-error" role="status"></p>
  </section>
  <div id="search-area">
    <label class="search-field"><span data-icon="search"></span><input id="search" type="search" placeholder="Ara veya komut yaz…" aria-label="Ara veya komut yaz"></label>
    <div id="results"></div>
  </div>
  <section id="quick-card" class="card">
    <div class="card-head">
      <span class="card-icon" data-icon="pencil"></span>
      <label for="text" class="card-title">Hızlı not</label>
      <button id="open-notes" class="icon-button card-link" title="Notları aç" aria-label="Notları aç"><span data-icon="external-link"></span></button>
    </div>
    <textarea id="text" rows="3" maxlength="5000" placeholder="Aklındakini yaz…"></textarea>
    <div class="actions"><button id="note" class="primary">Not olarak kaydet</button><select id="category" aria-label="Not kategorisi"><option value="note">Notlar</option><option value="read">Okunacaklar</option><option value="watch">İzlenecekler</option><option value="idea">Fikirler</option></select><label><input id="attach" type="checkbox"> Bu sayfa</label></div>
  </section>
  <p id="feedback" role="status"></p>
  <section id="today" class="card today" hidden>
    <button id="today-sites" class="card-head today-head" title="Odak bölümünü aç">
      <span class="card-icon" data-icon="clock-3"></span>
      <span class="card-title">Bugün</span>
      <span id="today-total" class="card-value accent"></span>
    </button>
    <div id="today-list" class="today-list"></div>
  </section>
  <nav class="tiles" aria-label="Kısayollar">
    <button id="open-notes-tile" class="tile"><span data-icon="notebook-pen"></span>Notlar</button>
    <button id="open-tabs-tile" class="tile"><span data-icon="app-window"></span>Sekmeler</button>
    <button id="tab-manager" class="tile"><span data-icon="layout-grid"></span>Sekme Yöneticisi</button>
  </nav>
  <div id="desktop-banner" class="banner" hidden>Masaüstü uygulamasına ulaşılamıyor. <button id="desktop-banner-switch">Depolama ayarları</button></div>
</main>
<script src="popup.js" type="module"></script>
</body>
</html>
